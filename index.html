
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسوق بلس</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 28px 22px;
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      margin: 0 0 10px;
      color: #4CAF50;
      text-align: center;
      font-size: 27px;
    }

    .subtitle {
      color: #bbb;
      text-align: center;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tabs button {
      flex: 1;
      padding: 12px 5px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #292929;
      color: #ddd;
      font-size: 14px;
    }

    .tabs button.active {
      background: #234b2a;
      border-color: #4CAF50;
      color: #fff;
    }

    label {
      display: block;
      margin: 16px 0 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #444;
      border-radius: 9px;
      background: #292929;
      color: #fff;
      font-size: 16px;
    }

    input:focus {
      outline: 1px solid #4CAF50;
    }

    .main-btn {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      background: #4CAF50;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      display: none;
      padding: 12px;
      margin-top: 16px;
      border-radius: 8px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .note {
      color: #999;
      font-size: 12px;
      line-height: 1.8;
      text-align: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>مرحبًا بك في تسوق بلس</h1>
    <p class="subtitle">
      تسوّق، أنجز المهام، واكتشف فرص التسويق بالعمولة
    </p>

    <div class="tabs">
      <button type="button" id="registerTab" class="active">
        إنشاء حساب
      </button>
      <button type="button" id="loginTab">
        تسجيل الدخول
      </button>
    </div>

    <div class="tabs">
      <button type="button" id="emailTab" class="active">
        البريد الإلكتروني
      </button>
      <button type="button" id="phoneTab">
        رقم الهاتف
      </button>
    </div>

    <form id="authForm">
      <label id="identityLabel" for="identity">
        البريد الإلكتروني
      </label>

      <input
        id="identity"
        type="email"
        placeholder="أدخل بريدك الإلكتروني"
        autocomplete="email"
        required
      >

      <label for="password">كلمة المرور</label>

      <input
        id="password"
        type="password"
        placeholder="أدخل كلمة المرور"
        minlength="6"
        autocomplete="current-password"
        required
      >

      <button class="main-btn" id="submitBtn" type="submit">
        إنشاء حساب جديد
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>

    <p class="note">
      حافظ على سرية كلمة المرور ولا تشاركها مع أي شخص.
    </p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      'https://valzgpkozmjiqiyhordx.supabase.co';

    const SUPABASE_ANON_KEY =
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhbGciOiJIUzI1NiIsInJlZiI6InZhbHpncGtvem1qaXFpeWhvcmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTUwOTAsImV4cCI6MjEwNzEzMTA5MH0.uCt9nDEupkUYbt-xyLMjCmaOFrE1XqbfCrqU1L-Yx3w';

    const form = document.getElementById('authForm');
    const identity = document.getElementById('identity');
    const password = document.getElementById('password');
    const identityLabel = document.getElementById('identityLabel');
    const submitBtn = document.getElementById('submitBtn');
    const message = document.getElementById('message');

    let mode = 'register';
    let method = 'email';
    let client = null;

    try {
      if (!window.supabase) {
        throw new Error('تعذّر تحميل مكتبة الاتصال.');
      }

      client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );
    } catch (error) {
      showMessage(
        'تعذّر تجهيز الاتصال. تأكد من اتصال الإنترنت.',
        false
      );
      console.error(error);
    }

    function showMessage(text, success) {
      message.textContent = text;
      message.style.display = 'block';
      message.style.background = success ? '#183b22' : '#482020';
      message.style.color = success ? '#b9f6ca' : '#ffcaca';
    }

    function clearMessage() {
      message.style.display = 'none';
      message.textContent = '';
    }

    function updateInterface() {
      document.getElementById('registerTab')
        .classList.toggle('active', mode === 'register');

      document.getElementById('loginTab')
        .classList.toggle('active', mode === 'login');

      document.getElementById('emailTab')
        .classList.toggle('active', method === 'email');

      document.getElementById('phoneTab')
        .classList.toggle('active', method === 'phone');

      identityLabel.textContent = method === 'email'
        ? 'البريد الإلكتروني' : 'رقم الهاتف';

      identity.type = method === 'email' ? 'email' : 'tel';

      identity.placeholder = method === 'email'
        ? 'أدخل بريدك الإلكتروني'
        : 'مثال: +201xxxxxxxxx';

      identity.autocomplete = method === 'email' ? 'email' : 'tel';

      submitBtn.textContent = mode === 'register'
        ? 'إنشاء حساب جديد' : 'تسجيل الدخول';

      password.autocomplete = mode === 'register'
        ? 'new-password' : 'current-password';

      clearMessage();
    }

    document.getElementById('registerTab').onclick = () => {
      mode = 'register';
      updateInterface();
    };

    document.getElementById('loginTab').onclick = () => {
      mode = 'login';
      updateInterface();
    };

    document.getElementById('emailTab').onclick = () => {
      method = 'email';
      updateInterface();
    };

    document.getElementById('phoneTab').onclick = () => {
      method = 'phone';
      updateInterface();
    };

    function translateError(error) {
      const text = (error.message || '').toLowerCase();

      if (text.includes('already registered') ||
          text.includes('already been registered')) {
        return 'هذا الحساب مسجل بالفعل. جرّب تسجيل الدخول.';
      }

      if (text.includes('invalid login credentials')) {
        return 'بيانات الدخول غير صحيحة.';
      }

      if (text.includes('email not confirmed')) {
        return 'البريد يحتاج إلى تأكيد. راجع إعدادات المصادقة.';
      }

      if (text.includes('invalid email')) {
        return 'صيغة البريد الإلكتروني غير صحيحة.';
      }

      if (text.includes('phone provider is disabled') ||
          text.includes('phone signups are disabled')) {
        return 'تسجيل الهاتف غير مفعّل في إعدادات Supabase.';
      }

      if (text.includes('sms') || text.includes('phone')) {
        return 'تعذّر تسجيل الهاتف. راجع إعدادات الهاتف في Supabase.';
      }

      if (text.includes('fetch')) {
        return 'تعذّر الاتصال بالخدمة. تحقق من الإنترنت.';
      }

      if (text.includes('rate limit')) {
        return 'محاولات كثيرة. انتظر قليلًا ثم حاول مجددًا.';
      }

      return 'تعذّر إكمال العملية: ' + error.message;
    }

    form.addEventListener('submit', async function(event) {
      event.preventDefault();
      clearMessage();

      if (!client) {
        showMessage('الاتصال بالخدمة غير جاهز.', false);
        return;
      }

      const value = identity.value.trim();
      const pass = password.value;

      if (!value || !pass) {
        showMessage('أدخل البيانات المطلوبة.', false);
        return;
      }

      if (pass.length < 6) {
        showMessage('كلمة المرور يجب ألا تقل عن 6 أحرف.', false);
        return;
      }

      if (method === 'phone' &&
          !/^\+[1-9]\d{7,14}$/.test(value)) {
        showMessage(
          'اكتب رقم الهاتف مع مفتاح الدولة، مثل +201xxxxxxxxx.',
          false
        );
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'جارٍ التنفيذ...';

      try {
        let result;

        if (mode === 'register' && method === 'email') {
          result = await client.auth.signUp({
            email: value,
            password: pass
          });
        } else if (mode === 'login' && method === 'email') {
          result = await client.auth.signInWithPassword({
            email: value,
            password: pass
          });
        } else if (mode === 'register' && method === 'phone') {
          result = await client.auth.signUp({
            phone: value,
            password: pass
          });
        } else {
          result = await client.auth.signInWithPassword({
            phone: value,
            password: pass
          });
        }

        if (result.error) {
          throw result.error;
        }

        if (mode === 'register' && !result.data.session) {
          showMessage(
            'تم إرسال طلب التسجيل، لكن تسجيل الدخول لم يكتمل. راجع إعدادات المصادقة في Supabase.',
            true
          );
        } else {
          showMessage(
            mode === 'register'
              ? 'تم إنشاء الحساب وتسجيل الدخول بنجاح.'
              : 'تم تسجيل الدخول بنجاح.',
            true
          );
        }
      } catch (error) {
        console.error('Supabase Auth error:', error);
        showMessage(translateError(error), false);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = mode === 'register'
          ? 'إنشاء حساب جديد' : 'تسجيل الدخول';
      }
    });

    updateInterface();
  </script>
</body>
</html>
