<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسوق بلس - تسجيل الدخول</title>
    <!-- مكتبة Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #4CAF50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        input { width: 100%; padding: 12px; border: 1px solid #444; border-radius: 8px; background: #2a2a2a; color: #fff; font-size: 16px; }
        input:focus { border-color: #4CAF50; outline: none; }
        button { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-primary { background-color: #4CAF50; color: white; }
        .btn-primary:hover { background-color: #43a047; }
        .btn-secondary { background-color: transparent; color: #4CAF50; border: 1px solid #4CAF50; }
        .btn-secondary:hover { background-color: rgba(76, 175, 80, 0.1); }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="formTitle">تسجيل الدخول</h2>
        <form id="authForm" onsubmit="handleAuth(event)">
            <div class="input-group">
                <label for="email">البريد الإلكتروني</label>
                <input type="email" id="email" required placeholder="أدخل بريدك الإلكتروني">
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" required placeholder="أدخل كلمة المرور">
            </div>
            <button type="submit" id="submitBtn" class="btn-primary">تسجيل الدخول</button>
            <button type="button" id="toggleBtn" class="btn-secondary" onclick="toggleMode()">ليس لديك حساب؟ أنشئ حساباً جديداً</button>
        </form>
    </div>

    <script>
        // ضع بيانات مشروعك هنا في الـ URL و Anon Key
        const SUPABASE_URL = 'https://رابط_مشروعك_هنا.supabase.co';
        const SUPABASE_ANON_KEY = 'مفتاح_anon_هنا';
        
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;

        function toggleMode() {
            isSignUp = !isSignUp;
            const title = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');
            const toggleBtn = document.getElementById('toggleBtn');

            if (isSignUp) {
                title.innerText = "إنشاء حساب جديد";
                submitBtn.innerText = "إنشاء الحساب";
                toggleBtn.innerText = "لديك حساب بالفعل؟ تسجيل الدخول";
            } else {
                title.innerText = "تسجيل الدخول";
                submitBtn.innerText = "تسجيل الدخول";
                toggleBtn.innerText = "ليس لديك حساب؟ أنشئ حساباً جديداً";
            }
        }

        async function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const { data, error } = await supabase.auth.signUp({ email, password });
                if (error) {
                    alert("خطأ في إنشاء الحساب: " + error.message);
                } else {
                    alert("تم إنشاء الحساب بنجاح! يمكنك تسجيل الدخول الآن.");
                    toggleMode();
                }
            } else {
                const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) {
                    alert("خطأ في تسجيل الدخول: " + error.message);
                } else {
                    alert("تم تسجيل الدخول بنجاح!");
                    window.location.reload();
                }
            }
        }
    </script>
</body>
</html>
